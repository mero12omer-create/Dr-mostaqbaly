<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      function showBanner(text) {
        var el = document.getElementById("statusBanner");
        if (!el) {
          document.addEventListener("DOMContentLoaded", function () { showBanner(text); });
          return;
        }
        el.style.display = "block";
        el.textContent = text;
      }
      window.onerror = function (msg, url, line, col, error) {
        showBanner("⚠️ خطأ JS: " + msg + " — سطر " + line + ":" + col);
        return false;
      };
      window.addEventListener("unhandledrejection", function (event) {
        showBanner("⚠️ خطأ Promise: " + (event.reason && event.reason.message ? event.reason.message : event.reason));
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بنك المذكرات - دكتور مستبقي 🩺</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* ===== توكيمات الصفحة ===== */
      .page-tabs {
        display: flex;
        gap: 8px;
        margin: 0 0 22px;
        overflow-x: auto;
        padding-bottom: 6px;
        border-bottom: 2px solid var(--border, #e5e7eb);
      }
      .page-tab {
        background: transparent;
        border: none;
        color: var(--text, #333);
        padding: 12px 18px;
        border-radius: 12px 12px 0 0;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        white-space: nowrap;
        font-family: inherit;
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
        transition: all 0.2s ease;
      }
      .page-tab:hover {
        background: rgba(37, 99, 235, 0.08);
        color: #2563eb;
      }
      .page-tab.active {
        color: #2563eb;
        border-bottom-color: #2563eb;
        background: rgba(37, 99, 235, 0.06);
      }
      .page-tab-panel {
        display: none;
        animation: fadeIn 0.3s ease;
      }
      .page-tab-panel.active {
        display: block;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* ===== فلاتر ===== */
      .filter-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
        overflow-x: auto;
        padding-bottom: 8px;
      }
      .filter-btn {
        background: var(--card-bg, #fff);
        border: 1px solid var(--border, #ccc);
        color: var(--text, #333);
        padding: 8px 18px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 600;
        white-space: nowrap;
      }
      .filter-btn.active,
      .filter-btn:hover {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
      }
      .pdf-card {
        background: var(--card-bg, #fff);
        border: 1px solid var(--border, #ccc);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .pdf-icon-box {
        width: 50px;
        height: 50px;
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        margin-bottom: 12px;
      }
      .pdf-info h3 {
        font-size: 16px;
        margin-bottom: 6px;
      }
      .pdf-info p {
        font-size: 13px;
        color: gray;
        margin-bottom: 15px;
      }
      .pdf-actions {
        display: flex;
        gap: 8px;
      }
      .btn-action {
        flex: 1;
        text-align: center;
        padding: 10px;
        font-size: 13px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
        display: inline-block;
        border: none;
        font-family: inherit;
      }
      .btn-read {
        border: 1px solid #2563eb;
        color: #2563eb;
        background: transparent;
      }
      .btn-download {
        background: #2563eb;
        color: #fff;
        border: none;
      }

      /* ===== التقييمات الأسبوعية ===== */
      .assess-card {
        background: var(--card-bg, #fff);
        border: 1px solid var(--border, #ccc);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-top: 4px solid #8b5cf6;
      }
      .assess-icon-box {
        width: 50px;
        height: 50px;
        background: rgba(139, 92, 246, 0.12);
        color: #8b5cf6;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        margin-bottom: 12px;
      }

    </style>
</head>
  <body>
    <div id="statusBanner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#dc2626; color:#fff; padding:14px; font-size:15px; text-align:center; direction:rtl; word-break:break-word;"></div>
    <header class="fixed-header">
      <div class="navbar">
        <h2 class="logo">دكتور مستبقي 🩺</h2>
        <div class="nav-actions">
          <a href="index.html" class="icon-btn" title="الرئيسية">🏠</a>
          <button class="icon-btn" id="themeToggle" title="تغيير المظهر">🌙</button>
        </div>
      </div>
    </header>

    <main class="container" style="margin-top: 80px; padding: 20px">
      <h2 class="section-title">📚 بنك المذكرات والتقييمات</h2>

      <!-- ===== التوكيمات ===== -->
      <div class="page-tabs" id="pageTabs">
        <button class="page-tab active" data-tab="notes">📚 المذكرات</button>
        <button class="page-tab" data-tab="assessments">📝 التقييمات الأسبوعية</button>
      </div>

      <!-- ============ تبويب المذكرات ============ -->
      <section id="tab-notes" class="page-tab-panel active">
        <div
          style="
            margin-bottom: 16px;
            padding: 12px 14px;
            background: rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 12px;
            color: var(--text);
          "
        >
          المحتوى المعروض الآن للنظام: <strong id="notesBranchLabel">عام</strong>
        </div>

        <div class="content-filter-panel">
          <div class="filter-select-row">
            <label for="notesBranchSelect">النظام الدراسي</label>
            <select id="notesBranchSelect" class="content-select">
              <option value="عام">عام 🎓</option>
              <option value="أزهر">أزهر 🕌</option>
            </select>
          </div>
          <div class="filter-caption">اختر المجموعة ثم المادة</div>
          <div class="filter-bar" id="groupFilterBar"></div>
          <div class="filter-bar" id="subjectFilterBar"></div>
        </div>

        <div
          class="cards-grid-4"
          id="notesGrid"
          style="
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
          "
        ></div>
      </section>

      <!-- ============ تبويب التقييمات الأسبوعية ============ -->
      <section id="tab-assessments" class="page-tab-panel">
        <div
          style="
            margin-bottom: 16px;
            padding: 12px 14px;
            background: rgba(139, 92, 246, 0.08);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 12px;
            color: var(--text);
          "
        >
          📝 التقييمات الأسبوعية — امتحانات قصيرة أسبوعية لكل مادة. النظام المعروض:
          <strong id="assessBranchLabel">عام</strong>
        </div>

        <div class="content-filter-panel">
          <div class="filter-select-row">
            <label for="assessBranchSelect">النظام الدراسي</label>
            <select id="assessBranchSelect" class="content-select">
              <option value="عام">عام 🎓</option>
              <option value="أزهر">أزهر 🕌</option>
            </select>
          </div>
          <div class="filter-caption">اختر المجموعة ثم المادة</div>
          <div class="filter-bar" id="assessGroupFilterBar"></div>
          <div class="filter-bar" id="assessSubjectFilterBar"></div>
        </div>

        <div
          class="cards-grid-4"
          id="assessGrid"
          style="
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
          "
        ></div>
      </section>

    </main>

    <script src="subjects.js"></script>
    <script src="script.js"></script>
    <script>
      /* =====================================================
         1) توكيمات الصفحة
      ===================================================== */
      function activateTab(name) {
        const valid = ["notes", "assessments"];
        if (!valid.includes(name)) name = "notes";
        document.querySelectorAll(".page-tab").forEach((b) => {
          b.classList.toggle("active", b.dataset.tab === name);
        });
        document.querySelectorAll(".page-tab-panel").forEach((p) => {
          p.classList.toggle("active", p.id === "tab-" + name);
        });
        if (name === "assessments") renderAssessments();
      }

      document.getElementById("pageTabs")?.addEventListener("click", (event) => {
        const btn = event.target.closest(".page-tab");
        if (btn) activateTab(btn.dataset.tab);
      });

      /* =====================================================
         2) تبويب المذكرات (المنطق الأصلي)
      ===================================================== */
      let currentBranch = localStorage.getItem("userBranch") === "أزهر" ? "أزهر" : "عام";
      let currentGroup = "all";
      let currentCategory = "all";
      let serverNotes = [];

      const escapeHtml = (value) => String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

      function setActiveButton(container, key) {
        container?.querySelectorAll(".filter-btn").forEach((button) => {
          button.classList.toggle("active", button.dataset.key === key);
        });
      }

      function renderFilterControls() {
        const branchSelect = document.getElementById("notesBranchSelect");
        if (branchSelect) branchSelect.value = currentBranch;
        const groups = SubjectCatalog.getGroupsForBranch(currentBranch);
        const groupBar = document.getElementById("groupFilterBar");
        const subjectBar = document.getElementById("subjectFilterBar");
        if (!groupBar || !subjectBar) return;

        groupBar.innerHTML = [
          `<button class="filter-btn ${currentGroup === "all" ? "active" : ""}" data-key="all" data-action="group">كل المجموعات ✨</button>`,
          ...groups.map((group) => `<button class="filter-btn ${currentGroup === group.key ? "active" : ""}" data-key="${group.key}" data-action="group">${escapeHtml(group.label)}</button>`),
        ].join("");

        const selectedGroup = currentGroup === "all"
          ? null
          : groups.find((group) => group.key === currentGroup);
        const subjects = selectedGroup
          ? selectedGroup.subjects
          : groups.flatMap((group) => group.subjects);
        subjectBar.innerHTML = [
          `<button class="filter-btn ${currentCategory === "all" ? "active" : ""}" data-key="all" data-action="subject">كل المواد</button>`,
          ...subjects.map((subject) => `<button class="filter-btn ${currentCategory === subject.key ? "active" : ""}" data-key="${subject.key}" data-action="subject">${escapeHtml(subject.label)}</button>`),
        ].join("");
      }

      async function renderNotes() {
        try {
          const token = localStorage.getItem("studentAuthToken");
          if (!token) { window.location.href = "login.html"; return; }
          const res = await fetch(`/api/notes?branch=${encodeURIComponent(currentBranch)}`, { headers: { "x-student-token": token } });
          if (res.status === 401) { window.location.href = "login.html"; return; }
          if (!res.ok) throw Error("تعذر جلب المذكرات");
          const data = await res.json();
          if (data.success) serverNotes = data.notes || [];
        } catch (error) {
          console.warn("تعذر جلب المذكرات من السيرفر:", error);
        }

        const allNotes = serverNotes.filter((note) => !note.branch || note.branch === currentBranch || note.branch === "مشترك");

        const filtered = allNotes.filter((note) => {
          const subjectKey = SubjectCatalog.normalizeSubjectKey(note.subjectKey || note.subject_key);
          const subjectGroup = note.subjectGroup || SubjectCatalog.getSubjectGroup(subjectKey, currentBranch);
          const groupMatch = currentGroup === "all" || subjectGroup === currentGroup;
          const subjectMatch = currentCategory === "all" || subjectKey === currentCategory;
          return groupMatch && subjectMatch;
        });

        const grid = document.getElementById("notesGrid");
        if (!grid) return;
        grid.innerHTML = "";
        if (!filtered.length) {
          grid.innerHTML = `<p class="empty-state-wide">لا توجد مذكرات منشورة في هذا الفلتر حاليًا 📄</p>`;
          return;
        }

        filtered.forEach((note) => {
          const fileUrl = note.fileUrl || note.file_url || "";
          const subjectName = note.subjectName || note.subject_name || SubjectCatalog.getSubjectLabel(note.subjectKey, currentBranch, "مادة");
          const size = note.size || "";
          const card = document.createElement("div");
          card.className = "pdf-card reveal-card";
          card.innerHTML = `
            <div>
              <div class="pdf-icon-box">📄</div>
              <div class="pdf-info">
                <h3>${escapeHtml(note.title || "مذكرة")}</h3>
                <p>المادة: ${escapeHtml(subjectName)} | ${escapeHtml(size)}</p>
                <p class="note-owner">صاحب المذكرة: ${escapeHtml(note.ownerName || "غير محدد")}</p>
              </div>
            </div>
            <div class="pdf-actions">
              <button class="btn-action btn-read" data-url="${escapeHtml(fileUrl)}">فتح المذكرة 👁️</button>
              <button class="btn-action btn-download" data-url="${escapeHtml(fileUrl)}">عرض / تحميل من Drive 📥</button>
            </div>`;
          card.querySelector(".btn-read").addEventListener("click", () => openPdf(fileUrl));
          card.querySelector(".btn-download").addEventListener("click", () => downloadPdf(fileUrl));
          grid.appendChild(card);
        });
      }

      function filterNotes(cat) {
        currentCategory = cat;
        setActiveButton(document.getElementById("subjectFilterBar"), cat);
        renderNotes();
      }

      function filterNotesGroup(group) {
        currentGroup = group;
        currentCategory = "all";
        renderFilterControls();
        renderNotes();
      }

      function changeNotesBranch(branch) {
        currentBranch = branch === "أزهر" ? "أزهر" : "عام";
        localStorage.setItem("userBranch", currentBranch);
        const label = document.getElementById("notesBranchLabel");
        if (label) label.textContent = currentBranch;
        currentGroup = "all";
        currentCategory = "all";
        renderFilterControls();
        renderNotes();
      }

      function openPdf(url) {
        if (!url) return showBanner("رابط المذكرة غير صالح!");
        window.open(url, "_blank", "noopener,noreferrer");
      }
      function downloadPdf(url) {
        if (!url) return showBanner("رابط المذكرة غير صالح!");
        window.open(url, "_blank", "noopener,noreferrer");
      }

      /* =====================================================
         3) تبويب التقييمات الأسبوعية
      ===================================================== */
      let assessBranch = localStorage.getItem("userBranch") === "أزهر" ? "أزهر" : "عام";
      let assessGroup = "all";
      let assessCategory = "all";
      let serverAssessments = [];
      let assessmentsLoaded = false;

      function renderAssessFilters() {
        const branchSelect = document.getElementById("assessBranchSelect");
        if (branchSelect) branchSelect.value = assessBranch;
        const groups = SubjectCatalog.getGroupsForBranch(assessBranch);
        const groupBar = document.getElementById("assessGroupFilterBar");
        const subjectBar = document.getElementById("assessSubjectFilterBar");
        if (!groupBar || !subjectBar) return;

        groupBar.innerHTML = [
          `<button class="filter-btn ${assessGroup === "all" ? "active" : ""}" data-key="all" data-action="agroup">كل المجموعات ✨</button>`,
          ...groups.map((group) => `<button class="filter-btn ${assessGroup === group.key ? "active" : ""}" data-key="${group.key}" data-action="agroup">${escapeHtml(group.label)}</button>`),
        ].join("");

        const selectedGroup = assessGroup === "all" ? null : groups.find((g) => g.key === assessGroup);
        const subjects = selectedGroup ? selectedGroup.subjects : groups.flatMap((g) => g.subjects);
        subjectBar.innerHTML = [
          `<button class="filter-btn ${assessCategory === "all" ? "active" : ""}" data-key="all" data-action="asubject">كل المواد</button>`,
          ...subjects.map((subject) => `<button class="filter-btn ${assessCategory === subject.key ? "active" : ""}" data-key="${subject.key}" data-action="asubject">${escapeHtml(subject.label)}</button>`),
        ].join("");
      }

      async function loadAssessments() {
        try {
          const token = localStorage.getItem("studentAuthToken");
          if (!token) { window.location.href = "login.html"; return; }
          const res = await fetch("/api/assessments", { headers: { "x-student-token": token } });
          if (res.status === 401) { window.location.href = "login.html"; return; }
          if (!res.ok) throw Error("تعذر جلب التقييمات");
          const data = await res.json();
          if (data.success) serverAssessments = data.assessments || [];
          assessmentsLoaded = true;
        } catch (error) {
          console.warn("تعذر جلب التقييمات:", error);
        }
      }

      async function renderAssessments() {
        if (!assessmentsLoaded) await loadAssessments();
        renderAssessFilters();

        const grid = document.getElementById("assessGrid");
        if (!grid) return;

        const filtered = serverAssessments.filter((item) => {
          const subjectKey = SubjectCatalog.normalizeSubjectKey(item.subjectKey || item.subject_key);
          const subjectGroup = item.subjectGroup || SubjectCatalog.getSubjectGroup(subjectKey, assessBranch);
          const groupMatch = assessGroup === "all" || subjectGroup === assessGroup;
          const subjectMatch = assessCategory === "all" || subjectKey === assessCategory;
          return groupMatch && subjectMatch;
        });

        grid.innerHTML = "";
        if (!filtered.length) {
          grid.innerHTML = `<p class="empty-state-wide">لا توجد تقييمات أسبوعية منشورة في هذا الفلتر حاليًا 📝</p>`;
          return;
        }

        filtered.forEach((item) => {
          const fileUrl = item.fileUrl || item.file_url || "";
          const subjectName = item.subjectName || item.subject_name || SubjectCatalog.getSubjectLabel(item.subjectKey, assessBranch, "مادة");
          const card = document.createElement("div");
          card.className = "assess-card reveal-card";
          card.innerHTML = `
            <div>
              <div class="assess-icon-box">📝</div>
              <div class="pdf-info">
                <h3>${escapeHtml(item.title || "تقييم أسبوعي")}</h3>
                <p>المادة: ${escapeHtml(subjectName)}${item.week ? " | " + escapeHtml(item.week) : ""}</p>
                <p class="note-owner">إعداد: ${escapeHtml(item.ownerName || "دكتور مستبقي")}</p>
              </div>
            </div>
            <div class="pdf-actions">
              <button class="btn-action btn-read" data-url="${escapeHtml(fileUrl)}">فتح التقييم 👁️</button>
              <button class="btn-action btn-download" data-url="${escapeHtml(fileUrl)}">عرض / تحميل من Drive 📥</button>
            </div>`;
          card.querySelector(".btn-read").addEventListener("click", () => openPdf(fileUrl));
          card.querySelector(".btn-download").addEventListener("click", () => downloadPdf(fileUrl));
          grid.appendChild(card);
        });
      }

      function changeAssessBranch(branch) {
        assessBranch = branch === "أزهر" ? "أزهر" : "عام";
        const label = document.getElementById("assessBranchLabel");
        if (label) label.textContent = assessBranch;
        assessGroup = "all";
        assessCategory = "all";
        renderAssessFilters();
        renderAssessments();
      }

      /* =====================================================
         5) ربط الأحداث عند التحميل
      ===================================================== */
      window.addEventListener("DOMContentLoaded", () => {
        // تبويب المذكرات
        const label = document.getElementById("notesBranchLabel");
        if (label) label.textContent = currentBranch;
        const branchSelect = document.getElementById("notesBranchSelect");
        branchSelect?.addEventListener("change", (event) => changeNotesBranch(event.target.value));
        document.getElementById("groupFilterBar")?.addEventListener("click", (event) => {
          const btn = event.target.closest("button[data-action='group']");
          if (btn) filterNotesGroup(btn.dataset.key);
        });
        document.getElementById("subjectFilterBar")?.addEventListener("click", (event) => {
          const btn = event.target.closest("button[data-action='subject']");
          if (btn) filterNotes(btn.dataset.key);
        });
        renderFilterControls();
        renderNotes();

        // تبويب التقييمات
        const aLabel = document.getElementById("assessBranchLabel");
        if (aLabel) aLabel.textContent = assessBranch;
        const aBranch = document.getElementById("assessBranchSelect");
        aBranch?.addEventListener("change", (event) => changeAssessBranch(event.target.value));
        document.getElementById("assessGroupFilterBar")?.addEventListener("click", (event) => {
          const btn = event.target.closest("button[data-action='agroup']");
          if (btn) { assessGroup = btn.dataset.key; assessCategory = "all"; renderAssessFilters(); renderAssessments(); }
        });
        document.getElementById("assessSubjectFilterBar")?.addEventListener("click", (event) => {
          const btn = event.target.closest("button[data-action='asubject']");
          if (btn) { assessCategory = btn.dataset.key; setActiveButton(document.getElementById("assessSubjectFilterBar"), assessCategory); renderAssessments(); }
        });
        renderAssessFilters();

        // فتح التبويب من الرابط ?tab=assessments
        const params = new URLSearchParams(window.location.search);
        const wanted = params.get("tab");
        if (wanted === "assessments") {
          activateTab("assessments");
        }
      });
    </script>
  </body>
</html>
