<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - دكتور مستقبلي 🩺</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">
  <div class="login-box">
    <h2>تسجيل الدخول 🩺</h2>
    <p>أهلاً بك مجدداً في منصة دكتور مستقبلي</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="phone">رقم الموبايل</label>
        <input type="tel" id="phone" placeholder="01xxxxxxxxx" required>
        <span class="error-msg" id="phoneError"></span>
      </div>

      <div class="form-group">
        <label for="password">كلمة السر</label>
        <input type="password" id="password" placeholder="أدخل كلمة السر" required>
        <span class="error-msg" id="passwordError"></span>
      </div>

      <button type="submit" class="btn-main">دخول</button>
      <p class="small-text">معندكش حساب؟ <a href="signup.html">اعمل حساب جديد</a></p>
    </form>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
