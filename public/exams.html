<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الامتحانات - دكتور مستقبلي 🩺</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* تنسيقات واجهة الامتحان الحديثة */
      .quiz-card-modern {
        background: var(--card-bg);
        border-radius: 20px;
        padding: 30px 20px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        margin-top: 20px;
      }
      .quiz-top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .score-badge {
        background: rgba(37, 99, 235, 0.1);
        color: var(--primary);
        padding: 6px 14px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 14px;
      }
      .q-text {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 20px;
        line-height: 1.6;
      }
      .options-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .modern-opt-btn {
        background: var(--bg);
        border: 2px solid var(--border);
        padding: 14px 18px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        text-align: right;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .modern-opt-btn:hover {
        border-color: var(--primary);
        transform: translateX(-4px);
      }
      .modern-opt-btn.correct {
        background: rgba(34, 197, 94, 0.15) !important;
        border-color: #22c55e !important;
        color: #166534 !important;
      }
      .modern-opt-btn.wrong {
        background: rgba(239, 68, 68, 0.15) !important;
        border-color: #ef4444 !important;
        color: #991b1b !important;
      }
      .progress-bar-bg {
        width: 100%;
        height: 8px;
        background: var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        background: var(--primary);
        width: 0%;
        transition: width 0.3s ease;
      }
    </style>
  </head>
  <body>
    <header class="fixed-header">
      <div class="navbar">
        <h2 class="logo">دكتور مستقبلي 🩺</h2>
      </div>
    </header>

    <main class="container">
      <section id="subjectSelection">
        <h2 class="section-title">اختر المادة 📚</h2>
        <div
          style="
            margin-bottom: 16px;
            padding: 12px 14px;
            background: rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 12px;
            color: var(--text);
          "
        >
          المحتوى المعروض الآن للنظام: <strong id="examBranchLabel">عام</strong>
        </div>

        <div class="content-filter-panel" id="examFiltersPanel">
          <div class="filter-select-row">
            <label for="examBranchFilter">النظام الدراسي</label>
            <select id="examBranchFilter" class="content-select">
              <option value="عام">عام 🎓</option>
              <option value="أزهر">أزهر 🕌</option>
            </select>
          </div>
          <div class="filter-caption">اختر المجموعة ثم المادة</div>
          <div class="filter-bar" id="examGroupFilter"></div>
          <div class="filter-bar" id="examSubjectFilter"></div>
        </div>

        <div class="cards-grid-4" id="subjectsGrid"></div>
      </section>

      <section id="lessonSelection" style="display: none">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          "
        >
          <h2 class="section-title" id="subjectTitle" style="margin: 0">
            الدروس المتاحة 📖
          </h2>
          <button class="btn-outline" onclick="goBackToSubjects()">
            رجوع للمواد ↩️
          </button>
        </div>
        <div class="cards-grid-4" id="lessonsGrid"></div>
      </section>

      <section id="examChallengeBox" style="display: none"></section>
    </main>

    <script src="script.js"></script>
    <script src="subjects.js"></script>
    <script>
      // قائمة المواد الدراسية الموحدة (يتم تحميلها حسب الفرع من السيرفر)
      let SUBJECTS = {};
      let SUBJECT_GROUPS = [];
      let currentExamBranch = localStorage.getItem("userBranch") === "أزهر" ? "أزهر" : "عام";
      let currentExamGroup = "all";
      let currentExamSubject = "all";

      const escapeExamHtml = (value) => String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

      function renderExamFilterControls() {
        const branchSelect = document.getElementById("examBranchFilter");
        const groupBar = document.getElementById("examGroupFilter");
        const subjectBar = document.getElementById("examSubjectFilter");
        if (branchSelect) branchSelect.value = currentExamBranch;
        if (!groupBar || !subjectBar) return;
        const groups = SubjectCatalog.getGroupsForBranch(currentExamBranch);
        groupBar.innerHTML = [
          `<button class="filter-btn ${currentExamGroup === "all" ? "active" : ""}" data-key="all" onclick="filterExamsGroup('all')">كل المجموعات</button>`,
          ...groups.map((group) => `<button class="filter-btn ${currentExamGroup === group.key ? "active" : ""}" data-key="${group.key}" onclick="filterExamsGroup('${group.key}')">${escapeExamHtml(group.label)}</button>`),
        ].join("");
        const selectedGroup = currentExamGroup === "all" ? null : groups.find((group) => group.key === currentExamGroup);
        const subjects = selectedGroup ? selectedGroup.subjects : groups.flatMap((group) => group.subjects);
        subjectBar.innerHTML = [
          `<button class="filter-btn ${currentExamSubject === "all" ? "active" : ""}" data-key="all" onclick="filterExamsSubject('all')">كل المواد</button>`,
          ...subjects.map((subject) => `<button class="filter-btn ${currentExamSubject === subject.key ? "active" : ""}" data-key="${subject.key}" onclick="filterExamsSubject('${subject.key}')">${escapeExamHtml(subject.label)}</button>`),
        ].join("");
      }

      function filterExamsGroup(group) {
        currentExamGroup = group;
        currentExamSubject = "all";
        renderExamFilterControls();
        renderSubjects();
      }

      function filterExamsSubject(subject) {
        currentExamSubject = subject;
        renderExamFilterControls();
        renderSubjects();
      }

      function changeExamBranch(branch) {
        currentExamBranch = branch === "أزهر" ? "أزهر" : "عام";
        currentExamGroup = "all";
        currentExamSubject = "all";
        loadSubjectsByBranch();
      }

      // تحديث قائمة المواد حسب الفرع (عام / أزهر)
      async function loadSubjectsByBranch() {
        const branch = currentExamBranch;
        localStorage.setItem("userBranch", branch);
        try {
          const res = await fetch(
            `/api/subjects?branch=${encodeURIComponent(branch)}`,
          );
          const data = await res.json();
          if (data.success && data.subjects) {
            SUBJECTS = Object.fromEntries(
              Object.entries(data.subjects).map(([key, title]) => [key, { title }]),
            );
            SUBJECT_GROUPS = data.groups
              ? Object.entries(data.groups).map(([key, group]) => ({
                  key,
                  label: group.label,
                  subjects: Object.entries(group.subjects || {}).map(([subjectKey, label]) => ({ key: subjectKey, label })),
                }))
              : SubjectCatalog.getGroupsForBranch(branch);
          } else {
            SUBJECT_GROUPS = SubjectCatalog.getGroupsForBranch(branch);
            SUBJECTS = SubjectCatalog.getSubjectsForBranch(branch);
          }
        } catch (e) {
          console.log("تعذر تحميل المواد حسب الفرع:", e);
          SUBJECT_GROUPS = SubjectCatalog.getGroupsForBranch(branch);
          SUBJECTS = Object.fromEntries(
            Object.entries(SubjectCatalog.getSubjectsForBranch(branch)).map(([key, title]) => [key, { title }]),
          );
        }
        const branchLabel = document.getElementById("examBranchLabel");
        if (branchLabel) branchLabel.textContent = branch;
        renderExamFilterControls();
        renderSubjects();
      }

      // الجمل التحفيزية
      const correctQuotes = [
        "عاش يا دكتور! كمل يا بطل 🩺✨",
        "الله ينور عليك! إجابة ممتازة 🔥",
        "أسطورة والله! استمر كده 💪",
        "إيه الشطارة دي! برافو عليك 🏆",
        "الله عليك يا دكتور المستقبل 🎉",
      ];

      const wrongQuotes = [
        "ولا يهمك يا بطل! عادي سؤال ومش آخر الدنيا، المهم نتعلم منه 💪",
        "جل من لا يسهو! ركز في التوضيح وحلها صح المرة الجاية 💡",
        "ولا تزعل نفسك، الوقعة دي هي اللي هتعلمك صح 😉",
        "عادي جداً! المهم عرفت الصح دلوقتي عشان متغلطش فيه في الامتحان 🚀",
      ];

      function getRandomQuote(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      // المؤثرات الصوتية النظيفة
      function playSound(type) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === "correct") {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
              0.01,
              ctx.currentTime + 0.25,
            );
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
          } else {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.setValueAtTime(110, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
              0.01,
              ctx.currentTime + 0.25,
            );
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
          }
        } catch (e) {}
      }

      let activeQuestions = [];
      let currentQIdx = 0;
      let earnedScore = 0;
      let serverCourses = {};
      let activeLessonId = null;
      let activeExamId = null;
      let selectedAnswers = [];

      // جلب البيانات من السيرفر (مع فلترة الفرع) + دمج البيانات المحلية
      async function getCoursesData() {
        const localData = JSON.parse(localStorage.getItem("coursesData")) || {};
        const branch = currentExamBranch;

        try {
          const res = await fetch(
            `/api/exams?branch=${encodeURIComponent(branch)}`,
          );
          const data = await res.json();
          if (data.success) {
            serverCourses = {};
            data.exams.forEach((exam) => {
              if (!serverCourses[exam.subjectKey]) {
                serverCourses[exam.subjectKey] = {
                  title: exam.subjectName || SUBJECTS[SubjectCatalog.normalizeSubjectKey(exam.subjectKey)]?.title || exam.subjectName || exam.subjectKey,
                  lessons: [],
                };
              }
              serverCourses[exam.subjectKey].lessons.push({
                id: "S" + exam.id,
                title: exam.lessonTitle,
                branch: exam.branch,
                questions: exam.content || [],
              });
            });
          }
        } catch (e) {
          console.log("تعذر جلب الامتحانات من السيرفر:", e);
        }

        // دمج بيانات السيرفر مع البيانات المحلية
        const merged = {};
        Object.keys(SUBJECTS).forEach((key) => {
          merged[key] = { title: SUBJECTS[key]?.title || SUBJECTS[key] || key, lessons: [] };
        });

        // قص البيانات غير المكررة من السيرفر
        Object.keys(serverCourses).forEach((key) => {
          if (merged[key]) {
            serverCourses[key].lessons.forEach((l) => {
              merged[key].lessons.push(l);
            });
          }
        });

        // إضافة البيانات المحلية
        Object.keys(localData).forEach((key) => {
          if (merged[key] && localData[key].lessons) {
            localData[key].lessons.forEach((l) => {
              merged[key].lessons.push(l);
            });
          }
        });

        return merged;
      }

      function renderSubjects() {
        const grid = document.getElementById("subjectsGrid");
        if (!grid) return;
        const groups = SUBJECT_GROUPS.length
          ? SUBJECT_GROUPS
          : [{ key: "general", label: "المواد الدراسية", subjects: Object.entries(SUBJECTS).map(([key, value]) => ({ key, label: value.title || value })) }];
        const visibleGroups = groups
          .filter((group) => currentExamGroup === "all" || group.key === currentExamGroup)
          .map((group) => ({
            ...group,
            subjects: group.subjects.filter((subject) => currentExamSubject === "all" || subject.key === currentExamSubject),
          }))
          .filter((group) => group.subjects.length);
        if (!visibleGroups.length) {
          grid.innerHTML = '<p class="empty-state-wide">لا توجد امتحانات أو مواد في هذا الفلتر حالياً.</p>';
          return;
        }
        grid.innerHTML = visibleGroups.map((group) => `
          <section class="subject-group-section" data-group="${group.key}">
            <div class="subject-group-heading"><span>${group.label}</span><small>${group.subjects.length} مواد</small></div>
            <div class="cards-grid-4 subject-group-grid">
              ${group.subjects.map((subject) => `
                <button class="card-item quiz-card subject-card-3d" type="button" onclick="selectSubject('${subject.key}')">
                  <span class="subject-card-kicker">${group.label}</span>
                  <h3>${subject.label || SUBJECTS[subject.key]?.title || subject.key}</h3>
                  <p>دروس تفاعلية وامتحانات تقيس الفهم.</p>
                  <span class="btn-main">عرض الدروس ⟵</span>
                </button>`).join("")}
            </div>
          </section>`).join("");
      }

      async function selectSubject(key) {
        const coursesData = await getCoursesData();
        document.getElementById("subjectSelection").style.display = "none";
        document.getElementById("lessonSelection").style.display = "block";
        document.getElementById("subjectTitle").innerText = SUBJECTS[key]?.title || SUBJECTS[key] || key;

        const lessonsGrid = document.getElementById("lessonsGrid");
        lessonsGrid.innerHTML = "";

        const lessons =
          coursesData[key] && coursesData[key].lessons
            ? coursesData[key].lessons
            : [];

        if (lessons.length === 0) {
          lessonsGrid.innerHTML =
            '<p style="grid-column: 1/-1; text-align: center; color: gray; padding: 40px;">لا توجد دروس مضافة حالياً لهذه المادة 📖</p>';
          return;
        }

        lessons.forEach((l) => {
          const card = document.createElement("div");
          card.className = "card-item quiz-card";
          card.onclick = () => startQuiz(l);
          card.innerHTML = `
          <h3>${escapeExamHtml(l.title || "درس")}</h3>
        <p>عدد الأسئلة: ${Array.isArray(l.questions) ? l.questions.length : 0}</p>
        <button class="btn-main">ابدأ التحدي 📝</button>
      `;
          lessonsGrid.appendChild(card);
        });
      }

      function goBackToSubjects() {
        document.getElementById("lessonSelection").style.display = "none";
        document.getElementById("subjectSelection").style.display = "block";
      }

      function startQuiz(lesson) {
        if (!lesson.questions || lesson.questions.length === 0) {
          return alert("لا توجد أسئلة مضافة لهذا الدرس بعد!");
        }

        // منع الطالب من دخول نفس الامتحان مرتين
        const sessionToken = localStorage.getItem("studentAuthToken") || "guest";
        const lessonId = lesson.id || lesson.title;
        const completedKey = "completedExams_" + sessionToken.slice(-16);
        const completed = JSON.parse(localStorage.getItem(completedKey)) || [];

        if (completed.includes(lessonId)) {
          alert(
            "⚠️ لقد أدّيت هذا الامتحان من قبل يا بطل! انتبه للدرس وخذ فرصة جديدة في امتحان آخر. 💪",
          );
          return;
        }

        activeQuestions = lesson.questions;
        currentQIdx = 0;
        earnedScore = 0;
        activeLessonId = lessonId;
        activeExamId = String(lessonId).startsWith("S") ? Number(String(lessonId).slice(1)) : null;
        selectedAnswers = Array(activeQuestions.length).fill(null);

        document.getElementById("lessonSelection").style.display = "none";
        document.getElementById("examChallengeBox").style.display = "block";

        renderQuestion(lesson.title);
      }

      function renderQuestion(lessonTitle) {
        const qData = activeQuestions[currentQIdx];
        const quizBox = document.getElementById("examChallengeBox");

        let optionsHtml = "";
        (Array.isArray(qData.options) ? qData.options : []).forEach((opt, idx) => {
          optionsHtml += `<button class="modern-opt-btn" type="button" data-option-index="${idx}">${escapeExamHtml(opt)}</button>`;
        });

        const pct = (currentQIdx / activeQuestions.length) * 100;

        quizBox.innerHTML = `
      <div class="quiz-card-modern">
        <div class="quiz-top-bar">
          <span class="score-badge">${escapeExamHtml(lessonTitle)}</span>
          <span class="score-badge">النقاط الحالية: <strong id="userScore">${earnedScore}</strong> ⭐</span>
        </div>
        <div class="progress-bar-bg" style="margin-bottom: 20px;">
          <div class="progress-bar-fill" style="width: ${pct}%;"></div>
        </div>
        <h3 class="q-text">${currentQIdx + 1}. ${escapeExamHtml(qData.q)}</h3>
        <div class="options-container">${optionsHtml}</div>
        <div class="explanation-box" id="explanationBox" style="display:none; margin-top:20px; padding:15px; background:var(--bg); border-radius:12px; border:1px solid var(--border); font-size:14px;">
          <span id="explanationText"></span>
        </div>
        <div style="margin-top: 25px; display: flex; justify-content: space-between; align-items: center;">
          <button class="btn-outline" onclick="location.reload()">إنهاء الامتحان ❌</button>
          <button class="btn-main" id="nextQBtn" type="button" style="display: none;">السؤال التالي ⟵</button>
        </div>
      </div>
    `;
        quizBox.querySelectorAll(".modern-opt-btn").forEach((button) => {
          button.addEventListener("click", () => checkAnswer(
            Number(button.dataset.optionIndex),
            Number(qData.correct),
            Number(qData.points || 2),
            String(qData.exp || ""),
            button,
            lessonTitle,
          ));
        });
        document.getElementById("nextQBtn")?.addEventListener("click", () => nextQuestion(lessonTitle));
      }

      function checkAnswer(
        selectedIdx,
        correctIdx,
        points,
        exp,
        selectedBtn,
        lessonTitle,
      ) {
        const allBtns = document.querySelectorAll(".modern-opt-btn");
        allBtns.forEach((b) => (b.disabled = true));

        const expBox = document.getElementById("explanationBox");
        const expText = document.getElementById("explanationText");
        selectedAnswers[currentQIdx] = selectedIdx;

        if (selectedIdx === correctIdx) {
          selectedBtn.classList.add("correct");
          playSound("correct");
          earnedScore += Number(points) || 2;
          document.getElementById("userScore").innerText = earnedScore;

          const quote = getRandomQuote(correctQuotes);
          expText.innerHTML = `<span style="color: #22c55e; font-weight: bold; display: block; margin-bottom: 5px;">${escapeExamHtml(quote)}</span>💡 <strong>التوضيح:</strong> ${escapeExamHtml(exp || "إجابة صحيحة!")}`;
        } else {
          selectedBtn.classList.add("wrong");
          playSound("wrong");
          if (allBtns[correctIdx]) allBtns[correctIdx].classList.add("correct");

          const quote = getRandomQuote(wrongQuotes);
          expText.innerHTML = `<span style="color: #ef4444; font-weight: bold; display: block; margin-bottom: 5px;">${escapeExamHtml(quote)}</span>💡 <strong>التوضيح:</strong> ${escapeExamHtml(exp || "راجع الإجابة الصحيحة أعلاه.")}`;
        }

        expBox.style.display = "block";
        document.getElementById("nextQBtn").style.display = "inline-block";
      }

      async function nextQuestion(lessonTitle) {
        currentQIdx++;
        if (currentQIdx < activeQuestions.length) {
          renderQuestion(lessonTitle);
          return;
        }
        await submitExamResults(lessonTitle);
      }

      async function submitExamResults(lessonTitle) {
        if (!activeExamId) {
          alert("تم إنهاء الامتحان، لكن هذا المحتوى قديم وغير مرتبط بسجل خادم؛ لم تتم إضافة نقاط محلية.");
          location.reload();
          return;
        }
        const token = localStorage.getItem("studentAuthToken");
        if (!token) {
          alert("سجل الدخول من جديد حتى يتم تصحيح الامتحان وإضافة النقاط بأمان.");
          location.reload();
          return;
        }
        try {
          const res = await fetch(`/api/exams/${activeExamId}/submit`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-student-token": token,
            },
            body: JSON.stringify({ answers: selectedAnswers }),
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            alert(data.message || "تعذر حفظ نتيجة الامتحان");
            return;
          }
          const sessionToken = localStorage.getItem("studentAuthToken") || "guest";
          const completedKey = "completedExams_" + sessionToken.slice(-16);
          const completed = JSON.parse(localStorage.getItem(completedKey)) || [];
          if (!completed.includes(activeLessonId)) {
            completed.push(activeLessonId);
            localStorage.setItem(completedKey, JSON.stringify(completed));
          }
          localStorage.setItem("userPoints", String(data.newPoints));
          alert(`عاش يا دكتور! كملت ${lessonTitle} وحصلت على ${data.score} من ${data.totalPoints} نقطة. إجابات صحيحة: ${data.correctCount} 🎉`);
          location.reload();
        } catch (error) {
          console.warn("تعذر إرسال نتيجة الامتحان:", error);
          alert("تعذر الاتصال بالخادم، ولم تتم إضافة النقاط. حاول مرة أخرى.");
        }
      }

      // تشغيل البدء (تحميل المواد حسب الفرع أولاً ثم العرض)
      const examBranchFilter = document.getElementById("examBranchFilter");
      examBranchFilter?.addEventListener("change", (event) => changeExamBranch(event.target.value));
      loadSubjectsByBranch();
    </script>
  </body>
</html>
