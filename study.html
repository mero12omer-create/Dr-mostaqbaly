<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      var bannerTimer = null;
      function showBanner(text, tone) {
        var el = document.getElementById("statusBanner");
        if (!el) {
          document.addEventListener("DOMContentLoaded", function () { showBanner(text, tone); });
          return;
        }
        el.style.display = "block";
        el.style.background = tone === "ok" ? "#16a34a" : (tone === "warn" ? "#d97706" : "#dc2626");
        el.textContent = text;
        clearTimeout(bannerTimer);
        bannerTimer = setTimeout(function () { el.style.display = "none"; }, 7000);
      }
      window.onerror = function (msg, url, line, col, error) {
        showBanner("⚠️ خطأ JS: " + msg + " — سطر " + line + ":" + col);
        return false;
      };
      window.addEventListener("unhandledrejection", function (event) {
        showBanner("⚠️ خطأ Promise: " + (event.reason && event.reason.message ? event.reason.message : event.reason));
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ابدأ مذاكرة - دكتور مستقبلي 🩺</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      :root { --gold:#ffb52e; --ink:#171127; --glass:rgba(22,16,42,.74); }
      body.study-page { background:#0e0b18; }
      body.study-page::before { background:linear-gradient(180deg,rgba(9,7,18,.42),rgba(9,7,18,.76)),url("study-bg.jpeg") center/cover fixed no-repeat; }
      .study-shell { max-width:620px; margin:0 auto; padding:18px 14px 42px; }
      .study-hero { min-height:calc(100vh - 94px); border-radius:30px; overflow:hidden; position:relative; color:#fff; background:linear-gradient(180deg,rgba(11,8,25,.2),rgba(11,8,25,.72)),url("study-bg.jpeg") center/cover; box-shadow:0 28px 70px rgba(8,5,20,.48); padding:24px 20px 20px; }
      .study-hero:after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,rgba(25,15,50,.1),rgba(17,8,34,.5)); }
      .study-content { position:relative; z-index:1; }
      .study-topline { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
      .study-kicker { display:inline-flex; padding:7px 18px; border:1px solid rgba(255,255,255,.5); border-radius:999px; background:rgba(255,255,255,.14); font-size:13px; font-weight:800; }
      .study-title { font-size:clamp(34px,8vw,58px); font-weight:900; color:#fff; margin:0 0 10px; text-shadow:0 4px 22px rgba(0,0,0,.45); }
      .subject-strip { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -4px 18px; padding:4px; }
      .subject-strip::-webkit-scrollbar { display:none; }
      .subject-pill { flex:0 0 auto; border:1px solid rgba(255,255,255,.5); color:#fff; background:rgba(36,25,59,.46); border-radius:999px; padding:9px 18px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; }
      .subject-pill.active { background:var(--gold); border-color:var(--gold); color:#24152b; box-shadow:0 8px 20px rgba(255,181,46,.3); }
      .focus-row { display:flex; justify-content:center; gap:8px; margin-bottom:22px; }
      .focus-chip { border:0; color:#fff; background:rgba(33,22,58,.62); border-radius:13px; padding:9px 16px; font-weight:800; cursor:pointer; font-family:inherit; }
      .focus-chip.active { background:#fff; color:#24152b; }
      .timer-display { font-size:clamp(70px,18vw,132px); line-height:1; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:2px; color:#fff; direction:ltr; text-align:center; text-shadow:0 5px 26px rgba(0,0,0,.35); margin:10px 0 8px; }
      .timer-ring { position:relative; width:min(310px,76vw); height:min(310px,76vw); margin:0 auto 10px; }
      .timer-ring svg { width:100%; height:100%; transform:rotate(-90deg); filter:drop-shadow(0 6px 10px rgba(0,0,0,.2)); }
      .timer-ring .timer-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
      .timer-ring .timer-display { position:absolute; top:50%; transform:translateY(-57%); margin:0; font-size:clamp(50px,13vw,88px); }
      .timer-goal-label { position:absolute; top:64%; font-size:13px; color:#fff; opacity:.86; }
      .timer-status { text-align:center; min-height:26px; font-size:16px; font-weight:700; color:#fff; margin-bottom:15px; }
      .timer-actions { display:grid; grid-template-columns:1fr .72fr; gap:10px; margin:0 auto 18px; max-width:480px; }
      .timer-actions button { min-height:58px; border-radius:18px; border:0; font-size:20px; font-weight:900; cursor:pointer; font-family:inherit; }
      .timer-start { grid-column:1; background:linear-gradient(135deg,#ffc34b,#ff9f25); color:#24152b; box-shadow:0 12px 25px rgba(255,170,41,.34); }
      .timer-finish { grid-column:2; background:rgba(39,27,61,.7); color:#fff; border:1px solid rgba(255,255,255,.4)!important; font-size:16px!important; }
      .timer-change { grid-column:1/-1; min-height:42px!important; background:transparent; color:#ffd36b; font-size:14px!important; border:1px solid rgba(255,211,107,.48)!important; }
      .study-success { margin:10px 0; padding:12px; border-radius:14px; background:rgba(34,197,94,.2); border:1px solid rgba(187,247,208,.5); color:#dcfce7; text-align:center; display:none; }
      .study-progress { background:rgba(24,16,45,.75); border:1px solid rgba(255,255,255,.35); border-radius:23px; padding:16px 18px 12px; }
      .progress-head,.progress-line { display:flex; justify-content:space-between; align-items:center; gap:10px; }
      .progress-head { font-weight:900; font-size:15px; }
      .progress-head span:last-child { color:#ffd36b; direction:rtl; }
      .progress-track { height:12px; background:rgba(255,255,255,.22); border-radius:99px; overflow:hidden; margin:10px 0 8px; }
      .progress-fill { height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,#ff9f25,#ffe07d); transition:width .3s; }
      .progress-line { color:#fff; font-size:13px; opacity:.9; }
      .study-stats { display:grid; grid-template-columns:repeat(3,1fr); margin-top:15px; padding-top:13px; border-top:1px solid rgba(255,255,255,.25); text-align:center; }
      .study-stats span { display:block; color:#fff; font-size:12px; border-left:1px solid rgba(255,255,255,.25); }
      .study-stats span:last-child { border-left:0; }
      .study-stats b { display:block; color:#fff; font-size:23px; line-height:1.2; }
      #studyGoalView { display:block; }
      #studyTimerView { display:none; }
      .goal-panel { background:rgba(24,16,45,.76); border:1px solid rgba(255,255,255,.3); border-radius:22px; padding:18px; }
      .goal-panel h3 { color:#fff; font-size:23px; }
      .goal-panel .study-sub { color:#eee; }
      .study-presets { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0; }
      .study-preset { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.45); border-radius:12px; padding:12px 4px; cursor:pointer; font-weight:800; font-family:inherit; }
      .study-preset.active { background:var(--gold); color:#24152b; border-color:var(--gold); }
      .study-adjuster { display:flex; align-items:center; justify-content:center; gap:14px; margin:16px 0 6px; }
      .study-adjuster button { width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.12); color:#fff; font-size:23px; cursor:pointer; }
      .study-goal-value { min-width:110px; text-align:center; }.study-goal-value .num{font-size:32px;font-weight:900;color:#fff}.study-goal-value .unit{color:#eee;font-size:13px}
      .study-unit-toggle { display:inline-flex; background:rgba(255,255,255,.14); border-radius:10px; padding:3px; margin:8px 0 15px; }.study-unit-toggle button{border:0;background:transparent;color:#fff;padding:7px 15px;border-radius:8px;cursor:pointer;font-weight:800;font-family:inherit}.study-unit-toggle button.active{background:var(--gold);color:#24152b}
      .study-save-btn { width:100%; padding:15px; border:0; border-radius:15px; background:linear-gradient(135deg,#ffc34b,#ff9f25); color:#24152b; font-size:17px; font-weight:900; cursor:pointer; font-family:inherit; }
      @media(max-width:560px){ .study-shell{padding:8px 8px 30px}.study-hero{border-radius:24px;padding:20px 14px 15px}.study-title{font-size:42px}.subject-pill{padding:8px 14px}.timer-actions{grid-template-columns:1fr 1fr}.study-stats b{font-size:20px}.study-presets{grid-template-columns:repeat(2,1fr)} }
    </style>
</head>
  <body class="study-page">
    <div id="statusBanner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#dc2626; color:#fff; padding:14px; font-size:15px; text-align:center; direction:rtl; word-break:break-word;"></div>
    <header class="fixed-header">
      <div class="navbar">
        <h2 class="logo">دكتور مستقبلي 🩺</h2>
        <div class="nav-actions">
          <a href="index.html" class="icon-btn" title="الرئيسية">🏠</a>
          <button class="icon-btn" id="themeToggle" title="تغيير المظهر">🌙</button>
        </div>
      </div>
    </header>

    <main class="study-shell">
      <section class="study-hero">
        <div class="study-content">
          <div class="study-topline"><span class="study-kicker">جلسة رقم <b id="sessionNumber" style="margin:0 .3em">3</b> اليوم</span><span aria-hidden="true">📚</span></div>
          <h1 class="study-title">ابدأ مذاكرة</h1>
          <div class="subject-strip" id="subjectStrip" aria-label="اختيار المادة"></div>

          <div id="studyGoalView" class="goal-panel">
            <h3>🎯 حدد هدفك اليومي</h3>
            <p class="study-sub">اختار الوقت اللي عايز توصله النهارده</p>
            <div class="study-presets" id="studyPresets"></div>
            <div class="study-adjuster"><button type="button" id="goalMinus" aria-label="أقل">−</button><div class="study-goal-value"><div class="num" id="goalValue">2</div><div class="unit" id="goalUnit">ساعة</div></div><button type="button" id="goalPlus" aria-label="أكثر">+</button></div>
            <div class="study-unit-toggle"><button type="button" id="unitHours" class="active">ساعات</button><button type="button" id="unitMinutes">دقائق</button></div>
            <button type="button" class="study-save-btn" id="saveGoalBtn">ابدأ وحدد هدفك</button>
          </div>

          <div id="studyTimerView">
            <div class="focus-row"><button class="focus-chip" data-focus="15">15 دقيقة</button><button class="focus-chip active" data-focus="25">تركيز 25 / راحة 5</button><button class="focus-chip" data-focus="45">45 دقيقة</button></div>
            <div class="timer-ring"><svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="100" stroke="rgba(255,255,255,.25)" stroke-width="10" fill="none"/><circle id="timerProgress" cx="115" cy="115" r="100" stroke="#ffb52e" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="628"/></svg><div class="timer-center"><div class="timer-display" id="timerDisplay">25:00</div><div class="timer-goal-label" id="timerPercent">0% من الجلسة</div></div></div>
            <div class="timer-status" id="timerStatus">جاهز تبدأ؟ يلا بينا 💪</div>
            <div class="timer-actions"><button type="button" class="timer-start" id="startPauseBtn">▶️ ابدأ</button><button type="button" class="timer-finish" id="finishBtn">إنهاء</button><button type="button" class="timer-change" id="changeGoalBtn">✏️ تغيير الهدف اليومي</button></div>
            <div class="study-success" id="studySuccess"></div>
            <div class="study-progress"><div class="progress-head"><span>هدف اليوم</span><span id="dailyGoalLabel">1 س 40 د من 3 س</span></div><div class="progress-track"><div class="progress-fill" id="dailyProgressFill"></div></div><div class="progress-line"><span id="dailyProgressText">فاضل ساعة و20 دقيقة وتحقق هدفك</span><span>🔥</span></div><div class="study-stats"><span><b id="statToday">0</b>اليوم</span><span><b id="statWeek">0</b>هذا الأسبوع</span><span><b id="statStreak">6</b>أيام الالتزام</span></div></div>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
    <script>
      /* =====================================================
         تايمر المذاكرة (صفحة ابدأ مذاكرة)
      ===================================================== */
      const STUDY_KEYS = {
        goal: "studyGoalMinutes",
        elapsed: "studyElapsedSeconds",
        running: "studyTimerRunning",
        start: "studyTimerStart",
      };
      let studyUnit = "hours"; // hours | minutes
      let studyGoalMinutes = Number(localStorage.getItem(STUDY_KEYS.goal)) || 0;
      // وضع المذاكرة المحلية: بيتفعّل لو السيرفر رفض بدء الجلسة، عشان الطالب يكمّل براحته
      let studyLocalOnlyMode = false;
      let studyElapsedSeconds = Number(localStorage.getItem(STUDY_KEYS.elapsed)) || 0;
      let studyTimerRunning = localStorage.getItem(STUDY_KEYS.running) === "1";
      let studyTimerStart = Number(localStorage.getItem(STUDY_KEYS.start)) || 0;
      let studyRoundStart = Number(localStorage.getItem("studyRoundStart")) || 0; // ثواني بداية جولة التركيز الحالية
      let focusCompleting = false;
      let focusDurationMinutes = Number(localStorage.getItem("studyFocusMinutes")) || 25;
      let selectedStudySubject = localStorage.getItem("studySubject") || "history";
      const studySubjects = [{key:"history",label:"التاريخ 📜"},{key:"arabic",label:"العربي 📖"},{key:"english",label:"الإنجليزي 🔤"},{key:"philosophy",label:"الفلسفة 🧠"},{key:"math",label:"الرياضيات 📐"}];
      let studyTickHandle = null;

      function saveStudyState() {
        localStorage.setItem(STUDY_KEYS.goal, String(studyGoalMinutes));
        localStorage.setItem(STUDY_KEYS.elapsed, String(studyElapsedSeconds));
        localStorage.setItem(STUDY_KEYS.running, studyTimerRunning ? "1" : "0");
        localStorage.setItem(STUDY_KEYS.start, String(studyTimerStart));
        localStorage.setItem("studyRoundStart", String(studyRoundStart));
      }

      function studyCurrentElapsed() {
        if (studyTimerRunning && studyTimerStart) {
          return studyElapsedSeconds + Math.floor((Date.now() - studyTimerStart) / 1000);
        }
        return studyElapsedSeconds;
      }

      function formatStudyTime(totalSeconds) {
        const s = Math.max(0, Math.floor(totalSeconds));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        const pad = (n) => String(n).padStart(2, "0");
        if (h > 0) return `${pad(h)}:${pad(m)}:${pad(sec)}`;
        return `${pad(m)}:${pad(sec)}`;
      }

      function minutesLabel(mins) {
        const m = Math.max(0, Math.round(mins));
        const h = Math.floor(m / 60);
        const r = m % 60;
        if (h && r) return `${h}\u200F س ${r}\u200F د`;
        if (h) return `${h}\u200F ساعة`;
        return `${r}\u200F دقيقة`;
      }

      function renderStudyPresets() {
        const box = document.getElementById("studyPresets");
        if (!box) return;
        const presets = studyUnit === "hours" ? [1, 2, 3, 4] : [15, 30, 45, 60];
        box.innerHTML = presets
          .map((val) => {
            const mins = studyUnit === "hours" ? val * 60 : val;
            const active = studyGoalMinutes === mins ? "active" : "";
            const label = studyUnit === "hours" ? `${val} ${val === 1 ? "ساعة" : "ساعات"}` : `${val} دقيقة`;
            return `<button type="button" class="study-preset ${active}" data-mins="${mins}">${label}</button>`;
          })
          .join("");
      }

      function updateGoalInputLimits() {
        const unitEl = document.getElementById("goalUnit");
        const valueEl = document.getElementById("goalValue");
        if (unitEl) unitEl.textContent = studyUnit === "hours" ? "ساعة" : "دقيقة";
        if (valueEl) {
          const shown = studyUnit === "hours"
            ? Math.max(1, Math.round(studyGoalMinutes / 60) || 1)
            : Math.max(5, studyGoalMinutes || 30);
          valueEl.textContent = shown;
        }
      }

      function setStudyUnit(unit) {
        studyUnit = unit === "minutes" ? "minutes" : "hours";
        document.getElementById("unitHours")?.classList.toggle("active", studyUnit === "hours");
        document.getElementById("unitMinutes")?.classList.toggle("active", studyUnit === "minutes");
        if (!studyGoalMinutes) studyGoalMinutes = studyUnit === "hours" ? 120 : 30;
        renderStudyPresets();
        updateGoalInputLimits();
      }

      function adjustGoal(direction) {
        if (studyUnit === "hours") {
          const hours = Math.max(1, Math.round((studyGoalMinutes || 60) / 60) + direction);
          studyGoalMinutes = Math.min(12, hours) * 60;
        } else {
          const mins = Math.max(5, (studyGoalMinutes || 30) + direction * 5);
          studyGoalMinutes = Math.min(720, mins);
        }
        renderStudyPresets();
        updateGoalInputLimits();
      }

      function showStudyGoal() {
        document.getElementById("studyGoalView").style.display = "block";
        document.getElementById("studyTimerView").style.display = "none";
        setStudyUnit(studyGoalMinutes && studyGoalMinutes % 60 !== 0 ? "minutes" : studyUnit);
        renderStudyPresets();
        updateGoalInputLimits();
      }

      function showStudyTimer() {
        document.getElementById("studyGoalView").style.display = "none";
        document.getElementById("studyTimerView").style.display = "block";
        const goalText = document.getElementById("timerGoalText");
        if (goalText) goalText.textContent = "هدفك النهارده: " + minutesLabel(studyGoalMinutes);
        const statGoal = document.getElementById("statGoal");
        if (statGoal) statGoal.textContent = minutesLabel(studyGoalMinutes);
        updateTimerUI();
        updateDailyProgress();
      }

      function updateTimerUI() {
        const elapsed = studyCurrentElapsed();
        const focusSeconds = Math.max(60, focusDurationMinutes * 60);
        const roundElapsed = Math.max(0, elapsed - studyRoundStart);
        if (studyTimerRunning && roundElapsed >= focusSeconds) { completeFocusRound(); return; }
        const remaining = Math.max(0, focusSeconds - roundElapsed);
        const display = document.getElementById("timerDisplay");
        if (display) display.textContent = formatStudyTime(remaining);
        const pct = Math.min(100, Math.round((roundElapsed / focusSeconds) * 100));
        const pctEl = document.getElementById("timerPercent");
        if (pctEl) pctEl.textContent = `${pct}% من جلسة التركيز`;
        const ring = document.getElementById("timerProgress");
        if (ring) { const circumference = 2 * Math.PI * 100; ring.style.strokeDashoffset = String(circumference - (pct / 100) * circumference); ring.style.stroke = pct >= 100 ? "#22c55e" : "#ffb52e"; }
        const btn = document.getElementById("startPauseBtn");
        if (btn) btn.textContent = studyTimerRunning ? "⏸️ إيقاف" : (elapsed > 0 ? "▶️ استكمال" : "▶️ ابدأ");
        const status = document.getElementById("timerStatus");
        if (status) status.textContent = studyTimerRunning
          ? (studyLocalOnlyMode ? "شغّال دلوقتي… وقتك محفوظ على جهازك 📚" : "شغّال دلوقتي… ركّز وذاكر 📚")
          : (elapsed > 0 ? "متوقف مؤقتًا — كمّل لما تجهز" : "جاهز تبدأ؟ يلا بينا 💪");
        document.querySelectorAll(".focus-chip").forEach((chip) => chip.classList.toggle("active", Number(chip.dataset.focus) === focusDurationMinutes));
      }

      // نهاية جولة التركيز: يتوقف التايمر ويظهر تنبيه بدل ما يفضل واقف على 00:00 ويكمل عد.
      async function completeFocusRound() {
        if (focusCompleting) return;
        focusCompleting = true;
        const capped = studyRoundStart + Math.max(60, focusDurationMinutes * 60);
        studyElapsedSeconds = capped;
        studyRoundStart = capped;
        studyTimerRunning = false;
        studyTimerStart = 0;
        saveStudyState();
        updateTimerUI();
        try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) { /* تجاهل */ }
        showBanner("خلّصت جولة التركيز ✅ خد راحة 5 دقايق وارجع كمّل", "ok");
        const token = localStorage.getItem("studentAuthToken");
        if (token) {
          try {
            const res = await fetch("/api/study/pause", { method: "POST", headers: { "Content-Type": "application/json", "x-student-token": token }, body: JSON.stringify({ capSeconds: capped }) });
            const data = await res.json();
            if (data.success && Number.isFinite(Number(data.elapsedSeconds))) {
              studyElapsedSeconds = Number(data.elapsedSeconds);
              studyRoundStart = Math.min(studyRoundStart, studyElapsedSeconds);
              saveStudyState();
              updateTimerUI();
            }
          } catch (e) { /* السيرفر هيتزامن عند الضغط على استكمال */ }
        }
        focusCompleting = false;
      }

      function startStudyTick() {
        if (studyTickHandle) clearInterval(studyTickHandle);
        studyTickHandle = setInterval(updateTimerUI, 1000);
      }

      /* =====================================================
         إصلاح: السيرفر ساعات بيرجّع «تعذر بدء جلسة المذاكرة»
         فكان الطالب بيتقفل عليه التايمر ويرجع لآخر حالة متوقفة.
         الحل: نجرب أكتر من طريقة، ولو كلهم فشلوا نكمّل مذاكرة
         محليًا (الوقت مش بيضيع) بدون رسالة حمراء مزعجة.
         ===================================================== */
      async function postStudyApi(endpoint, body) {
        const token = localStorage.getItem("studentAuthToken");
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-student-token": token },
          body: JSON.stringify(body || {}),
        });
        let data = {};
        try { data = await res.json(); } catch (e) { data = {}; }
        return {
          ok: res.ok && data.success === true,
          status: res.status,
          auth: res.status === 401,
          message: data.message || "",
          data: data,
        };
      }

      // محاولات الإنقاذ: بعض أنواع الأعطال بتتحل بإعادة الطلب بشكل مختلف
      async function tryStartSession(isResume) {
        // محاولة 1: البدء مع إرسال الهدف اليومي
        let attempt = await postStudyApi("/api/study/start", { goalMinutes: studyGoalMinutes });
        if (attempt.ok || attempt.auth) return attempt;

        if (isResume) {
          // محاولة 2: استكمال بدون تغيير الهدف (بعض السيرفرات بترفض تغيير الهدف أثناء جلسة مفتوحة)
          attempt = await postStudyApi("/api/study/start", {});
          if (attempt.ok || attempt.auth) return attempt;

          // محاولة 3: قفل أي جلسة قديمة عالقة على السيرفر ثم البدء من جديد
          await postStudyApi("/api/study/pause", {});
          attempt = await postStudyApi("/api/study/start", {});
          if (attempt.ok || attempt.auth) return attempt;
        }
        return attempt;
      }

      async function startPauseStudy() {
        const token = localStorage.getItem("studentAuthToken");
        if (!token) { window.location.href = "login.html"; return; }
        const button = document.getElementById("startPauseBtn");
        if (button) button.disabled = true;
        const wasRunning = studyTimerRunning;
        const isResume = !studyTimerRunning && studyCurrentElapsed() > 0;
        if (studyTimerRunning) {
          // إيقاف مؤقت
          studyElapsedSeconds = studyCurrentElapsed();
          studyTimerRunning = false;
          studyTimerStart = 0;
        } else {
          // بدء/استكمال
          studyTimerRunning = true;
          studyTimerStart = Date.now();
        }
        saveStudyState();
        updateTimerUI();
        try {
          const attempt = wasRunning
            ? await postStudyApi("/api/study/pause", {})
            : await tryStartSession(isResume);

          if (attempt.auth) {
            studyTimerRunning = wasRunning;
            if (wasRunning) studyTimerStart = Date.now();
            saveStudyState();
            updateTimerUI();
            showBanner("انتهت جلستك، هنوديك لتسجيل الدخول ثم كمّل مذاكرتك");
            setTimeout(function () { window.location.href = "login.html"; }, 2500);
            return;
          }

          if (attempt.ok) {
            // اتزامنّا مع السيرفر بنجاح
            studyLocalOnlyMode = false;
            if (Number.isFinite(Number(attempt.data && attempt.data.elapsedSeconds))) {
              const serverElapsed = Number(attempt.data.elapsedSeconds);
              // حماية وقت الطالب: عند الاستكمال مناخدش رقم أقل من الوقت المسجّل على جهازه
              studyElapsedSeconds = wasRunning
                ? serverElapsed
                : Math.max(studyElapsedSeconds, serverElapsed);
            }
            if (!wasRunning && attempt.data && attempt.data.running) studyTimerStart = Date.now();
            if (!wasRunning) {
              await pushPendingStudySync();
            }
            saveStudyState();
            updateTimerUI();
          } else {
            // السيرفر رفض: منمنعش الطالب — التايمر بيكمل ووقته محفوظ على جهازه
            studyLocalOnlyMode = true;
            saveStudyState();
            updateTimerUI();
            showBanner(
              (attempt.message ? attempt.message + " — " : "") +
                (wasRunning
                  ? "⏸️ وقفنا التايمر على جهازك، وهنحاول نزامن وقتك مع السيرفر تاني."
                  : "⚠️ إنت مذاكرتك شغالة عادي دلوقتي، وهنحاول نحفظ وقتك على السيرفر تاني."),
              "warn"
            );
          }
        } catch (error) {
          // عطل في الشبكة: نكمل محليًا برضه
          studyLocalOnlyMode = true;
          saveStudyState();
          updateTimerUI();
          showBanner("النت واقع شكله — مذاكرتك كمليّة على جهازك وهنزامنها أول ما النت يرجع.", "warn");
        } finally {
          if (button) button.disabled = false;
        }
      }

      // مزامنة مؤجلة: لو جلسة قديمة محفوظة محليًا ولسه موصلتش للسيرفر
      async function pushPendingStudySync() {
        const pendingKey = "studyPendingSyncMinutes";
        const pending = Number(localStorage.getItem(pendingKey) || 0);
        if (!pending || pending < 1) return;
        try {
          const res = await postStudyApi("/api/study/session", {});
          if (res.ok) {
            localStorage.removeItem(pendingKey);
            showBanner("✅ اتزامن وقت مذاكرتك القديم مع السيرفر", "ok");
            refreshStudyStats();
          }
        } catch (e) { /* نحاول تاني بعدين */ }
      }

      async function finishStudy() {
        const elapsed = studyCurrentElapsed();
        const minutes = Math.floor(elapsed / 60);
        if (minutes < 1) {
          showBanner("لسه مذاكرتش دقيقة كاملة، كمّل شوية كمان 💪");
          return;
        }
        if (!window.confirm(`هتحفظ جلسة مدتها تقريبًا ${minutesLabel(minutes)}؟`)) return;
        const token = localStorage.getItem("studentAuthToken");
        if (!token) { window.location.href = "login.html"; return; }
        try {
          const res = await fetch("/api/study/session", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-student-token": token },
            body: JSON.stringify({}),
          });
          if (res.status === 401) { const authErr = new Error("انتهت جلستك، هنوديك لتسجيل الدخول ثم كمّل مذاكرتك"); authErr.auth = true; throw authErr; }
          const data = await res.json();
          if (!res.ok || !data.success) throw Error(data.message || "تعذر حفظ جلسة المذاكرة");
          // إعادة التهيئة
          studyElapsedSeconds = 0;
          studyRoundStart = 0;
          studyTimerRunning = false;
          studyTimerStart = 0;
          studyLocalOnlyMode = false;
          localStorage.removeItem("studyPendingSyncMinutes");
          saveStudyState();
          updateTimerUI();
          const success = document.getElementById("studySuccess");
          if (success) {
            success.style.display = "block";
            success.textContent = `🎉 عاش يا دكتور! سجّلنا ${minutesLabel(minutes)} مذاكرة. كمّل كده وابقى الأول في لوحة الصدارة!`;
          }
          refreshStudyStats();
        } catch (error) {
          if (error.auth) {
            showBanner("انتهت جلستك، هنوديك لتسجيل الدخول ثم كمّل مذاكرتك");
            setTimeout(function () { window.location.href = "login.html"; }, 2500);
            return;
          }
          // وقت الطالب مش بيضيع: بنحفظه محليًا وبنحاول نزامنه أول ما يقدر
          localStorage.setItem("studyPendingSyncMinutes", String(Math.max(1, minutes)));
          showBanner(
            (error.message ? error.message + " — " : "") +
              "⏳ وقت مذاكرتك محفوظ على جهازك، وهنحاول نزامنه مع السيرفر تاني (بدون ما توقف مذاكرة).",
            "warn"
          );
          refreshStudyStats();
        }
      }

      async function refreshStudyStats() {
        const token = localStorage.getItem("studentAuthToken");
        if (!token) return;
        try {
          const res = await fetch("/api/study/stats", { headers: { "x-student-token": token } });
          const data = await res.json();
          if (data.success) {
            const statToday = document.getElementById("statToday");
            if (statToday) { statToday.textContent = minutesLabel(data.todayMinutes || 0); statToday.dataset.minutes = String(data.todayMinutes || 0); }
            updateDailyProgress();
          }
        } catch (e) {
          /* تجاهل */
        }
      }

      function changeStudyGoal() {
        // إيقاف التايمر مؤقتًا عند تغيير الهدف
        if (studyTimerRunning) {
          studyElapsedSeconds = studyCurrentElapsed();
          studyTimerRunning = false;
          studyTimerStart = 0;
          saveStudyState();
        }
        showStudyGoal();
      }

      /* =====================================================
         ربط الأحداث عند التحميل
      ===================================================== */
      function renderStudySubjects() { const box=document.getElementById("subjectStrip"); if(!box) return; box.innerHTML=studySubjects.map(s=>`<button type="button" class="subject-pill ${s.key===selectedStudySubject?"active":""}" data-subject="${s.key}">${s.label}</button>`).join(""); }
      function updateDailyProgress() { const goal=Math.max(1,studyGoalMinutes); const today=Number(document.getElementById("statToday")?.dataset.minutes||0); const pct=Math.min(100,Math.round(today/goal*100)); const fill=document.getElementById("dailyProgressFill"); if(fill) fill.style.width=pct+"%"; const label=document.getElementById("dailyGoalLabel"); if(label) label.textContent=`${minutesLabel(today)} من ${minutesLabel(goal)}`; const text=document.getElementById("dailyProgressText"); if(text) text.textContent=today>=goal?"أحسنت! حققت هدفك اليوم 🎉":"فاضل "+minutesLabel(Math.max(0,goal-today))+" وتحقق هدفك"; }
      function setFocusDuration(minutes) { focusDurationMinutes=Math.max(5,Number(minutes)||25); localStorage.setItem("studyFocusMinutes",String(focusDurationMinutes)); updateTimerUI(); }
      window.addEventListener("DOMContentLoaded", () => {
        document.getElementById("studyPresets")?.addEventListener("click", (event) => {
          const btn = event.target.closest(".study-preset");
          if (!btn) return;
          studyGoalMinutes = Number(btn.dataset.mins);
          renderStudyPresets();
          updateGoalInputLimits();
        });
        document.getElementById("goalMinus")?.addEventListener("click", () => adjustGoal(-1));
        document.getElementById("goalPlus")?.addEventListener("click", () => adjustGoal(1));
        document.getElementById("unitHours")?.addEventListener("click", () => setStudyUnit("hours"));
        document.getElementById("unitMinutes")?.addEventListener("click", () => setStudyUnit("minutes"));
        document.getElementById("saveGoalBtn")?.addEventListener("click", () => {
          if (!studyGoalMinutes || studyGoalMinutes < 1) studyGoalMinutes = 60;
          saveStudyState();
          showStudyTimer();
        });
        document.getElementById("startPauseBtn")?.addEventListener("click", startPauseStudy);
        document.getElementById("finishBtn")?.addEventListener("click", finishStudy);
        document.getElementById("changeGoalBtn")?.addEventListener("click", changeStudyGoal);
        document.getElementById("subjectStrip")?.addEventListener("click", (event) => { const btn=event.target.closest(".subject-pill"); if(!btn)return; selectedStudySubject=btn.dataset.subject; localStorage.setItem("studySubject",selectedStudySubject); renderStudySubjects(); });
        document.querySelectorAll(".focus-chip").forEach((chip)=>chip.addEventListener("click",()=>setFocusDuration(chip.dataset.focus)));
        renderStudySubjects();


        startStudyTick();
        refreshStudyStats();

        // لو الهدف متحدد قبل كده افتح شاشة التايمر مباشرة، غير كده افتح شاشة تحديد الهدف
        if (studyGoalMinutes > 0) showStudyTimer();
        else showStudyGoal();
      });
    </script>
  </body>
</html>
